name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go tests + archcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go test
        run: go test ./...
      - name: Architecture guard
        run: go run ./tools/archcheck

  frontend:
    name: Vue frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Vite build
        run: npm run build
